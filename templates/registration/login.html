{% extends 'base_publico.html' %}

{% block title %}Iniciar Sesion{% endblock %}

{% block contenido %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Iniciar Sesion</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {% if form.non_field_errors %}
                            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label fw-bold">Usuario</label>
                            <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label fw-bold">Contraseña</label>
                            <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
                        </div>
                        <input type="hidden" name="next" value="{{ next }}">
                        <button type="submit" class="btn btn-success w-100">Ingresar</button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">Eres turista y no tienes cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
