{% extends 'base_panel.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-6">
        <div class="card border-left-danger shadow">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-danger">Confirmar eliminacion</h6>
            </div>
            <div class="card-body text-center">
                <h5 class="mb-4">Seguro que deseas eliminar este registro?</h5>
                <p class="h5 font-weight-bold text-gray-800 mb-4">{{ object }}</p>
                {% if aviso %}
                    <div class="alert alert-warning">{{ aviso }}</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center">
                        <a href="{{ url_volver }}" class="btn btn-secondary mr-3">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Si, eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
