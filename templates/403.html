{% extends 'base_publico.html' %}

{% block title %}Acceso denegado{% endblock %}

{% block contenido %}
<div class="container py-5 text-center">
    <h1 class="display-4 text-danger fw-bold">403</h1>
    <h2 class="h4 mb-3">Acceso denegado</h2>
    <p class="text-muted">Tu rol no tiene permiso para ver esta pagina.</p>
    {% if user.is_authenticated %}
        <a href="{% url 'panel' %}" class="btn btn-success">Volver a mi panel</a>
    {% else %}
        <a href="{% url 'login' %}" class="btn btn-success">Ingresar</a>
    {% endif %}
</div>
{% endblock %}
